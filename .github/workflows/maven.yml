name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven wrapper
        run: ./mvnw --batch-mode --update-snapshots verify

  integration:
    # The `integration`-tagged tests are the only ones that run the real
    # pipeline end to end over the checked-in test_data fixtures (~5 min
    # locally). pom.xml excludes them from the default build, so before this
    # job existed they only ever ran when someone invoked them by hand.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        # -Dgiani.requireFixtures=true makes a missing or moved fixture FAIL
        # rather than skip (see net.calm.giani.TestFixtures). Without it a
        # broken fixture path shows up as a green build that tested nothing.
        run: ./mvnw --batch-mode -Pintegration -Dgiani.requireFixtures=true verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
