name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven wrapper
        run: ./mvnw --batch-mode --update-snapshots verify

  integration:
    # The `integration`-tagged tests are the only ones that run the real
    # pipeline end to end over the checked-in test_data fixtures (~5 min
    # locally). pom.xml excludes them from the default build, so before this
    # job existed they only ever ran when someone invoked them by hand.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        # -Dgiani.requireFixtures=true makes a missing or moved fixture FAIL
        # rather than skip (see net.calm.giani.TestFixtures). Without it a
        # broken fixture path shows up as a green build that tested nothing.
        run: ./mvnw --batch-mode -Pintegration -Dgiani.requireFixtures=true verify

      - name: Verify the integration tests actually ran
        # A green Maven run is NOT proof the `integration`-tagged tests were
        # selected. If the profile ever failed to activate they would simply be
        # excluded, the build would still pass, and the uploaded reports would
        # look much the same — so assert the two reports exist and ran unskipped
        # rather than inferring it from the job's exit code.
        run: |
          status=0
          for t in PipelineExecutorIntegrationTest PipelineExecutorTimelapseIntegrationTest; do
            report="target/surefire-reports/net.calm.giani.exec.$t.txt"
            if [ ! -f "$report" ]; then
              echo "::error::$t produced no surefire report — the integration profile did not select it"
              status=1
              continue
            fi
            if ! grep -q "Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0" "$report"; then
              echo "::error::$t did not run cleanly:"
              cat "$report"
              status=1
            fi
          done
          exit $status

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
